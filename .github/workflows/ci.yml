name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the dependencies from uv.lock
        run: uv sync --locked

      - name: Check the formatting
        run: uv run ruff format --check m3db tests

      - name: Lint
        run: uv run ruff check m3db tests

      - name: Run the tests
        run: uv run pytest

      - name: Build the example with example.sh
        if: runner.os != 'Windows'
        working-directory: example
        run: bash example.sh

      - name: Build the example with example.ps1
        if: runner.os == 'Windows'
        working-directory: example
        shell: pwsh
        run: ./example.ps1
